      <stop offset="0" stop-color="#A06A2E"/>
      <stop offset="1" stop-color="#D3A064"/>
    </linearGradient>
  </defs>

  <!-- Monogram AL -->
  <g fill="#1C1917">
    <!-- A upper -->
    <path d="M597,305 L612,306 L692,508 L650,498 L570,365 L522,458 L508,457 Z"/>
    <!-- A lower -->
    <path d="M497,533 L522,548 L505,620 L536,632 L536,645 L410,645 L410,636 L442,631 Z"/>
    <!-- L -->
    <path d="M668,372 H770 V384 L745,388 V612 Q790,626 840,614 L886,572 L862,645 H645 V636 L688,628 V388 L668,382 Z"/>
  </g>

  <!-- Gold swoosh -->
  <path fill="url(#gold)" d="M393,585 C400,510 460,462 540,462 C640,462 720,555 800,580 C830,590 855,592 872,590 C850,605 810,610 770,600 C690,580 630,500 545,490 C470,490 420,530 393,585 Z"/>

