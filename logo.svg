  <!-- Text -->
  <g font-family="'Cormorant Garamond','Cinzel','Trajan Pro','Times New Roman',Georgia,serif">
    <text x="140" y="808" font-size="132" fill="#1C1917" textLength="978" lengthAdjust="spacing">AESTHETIC</text>
    <text x="232" y="897" font-size="64" fill="#A8712F" textLength="800" lengthAdjust="spacing">LIFESTYLE TOUCH</text>
  </g>
  <g font-family="'Montserrat','Helvetica Neue',Arial,sans-serif">
