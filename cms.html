<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0A0A0A" />
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="robots" content="noindex, nofollow">
<title>CMS — Aesthetic Lifestyle Touch</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="products-data.js"></script>
<script src="auth.js"></script>
<script src="admin-auth.js"></script>
<script src="loader.js"></script>
<link rel="stylesheet" href="loader.css">
<link rel="stylesheet" href="mobile.css">
<link rel="stylesheet" href="admin-shell.css">

<style>
  #cms-gate{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--alt-black); color:#fff; text-align:center; padding:24px; }
</style>
<link rel="stylesheet" href="tailwind.css">
</head>
<body>

<div id="site-loader" aria-hidden="true">
  <div class="sl-glow"></div>
  <p class="sl-mark">AESTHETIC <span>LIFESTYLE TOUCH</span></p>
  <div class="sl-progress-track"><div class="sl-progress-fill"></div></div>
</div>

<!-- Shown only for the instant before the auth-check redirect fires -->
<div id="cms-gate">
  <div>
    <p class="font-mono text-xs tracking-[0.2em] uppercase mb-3" style="color:var(--alt-beige);">Aesthetic Lifestyle Touch</p>
    <p class="font-display text-lg">Checking admin session…</p>
  </div>
</div>

<!-- ================================================================
     CMS SHELL
     ================================================================ -->
<div id="admin-shell-root" style="display:none;">
<div id="admin-shell">

  <div id="admin-sidebar-overlay"></div>
  <aside id="admin-sidebar">
    <div class="flex items-center justify-between px-5 pt-6 pb-5">
      <a href="Home.html" class="font-display text-[14px] font-medium tracking-tight leading-tight" style="color:#fff;">
        AESTHETIC<br><span style="color:rgba(255,255,255,0.45);font-weight:400;">LIFESTYLE TOUCH</span>
      </a>
      <button id="admin-sidebar-close" class="adm-icon-btn lg:hidden" style="color:rgba(255,255,255,0.6);" aria-label="Close menu">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="admin-sidebar-scroll" class="no-scrollbar">
      <div id="admin-nav"></div>
    </div>
    <div class="p-4" style="border-top:1px solid rgba(255,255,255,0.08);">
      <button id="admin-logout-btn" class="side-link" style="color:#C97B7B;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Sign Out
      </button>
    </div>
  </aside>

  <div id="admin-main">
    <header id="admin-topbar">
      <button id="admin-sidebar-open" class="adm-icon-btn lg:hidden" aria-label="Open menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <h1 id="admin-page-title" class="font-display text-base font-medium">CMS Overview</h1>
      <button id="admin-cmdk-trigger" class="adm-input flex items-center gap-2 text-[var(--alt-muted)] ml-2" style="max-width:280px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <span class="text-[13px] hidden sm:inline">Search products, media, collections…</span>
        <span class="font-mono text-[10px] border border-[var(--alt-border)] rounded px-1.5 py-0.5 ml-auto hidden sm:inline">⌘K</span>
      </button>
      <div class="flex items-center gap-2 ml-auto">
        <a href="admin.html" class="adm-btn adm-btn-ghost hidden sm:inline-block">Store Admin</a>
        <div class="avatar-circle" id="admin-avatar">O</div>
      </div>
    </header>

    <main id="admin-content">
      <div class="admin-hero-glow" aria-hidden="true"></div>
      <div class="admin-view active" data-view="overview" id="view-overview"></div>
      <div class="admin-view" data-view="products" id="view-products"></div>
      <div class="admin-view" data-view="media" id="view-media"></div>
      <div class="admin-view" data-view="collections" id="view-collections"></div>
      <div class="admin-view" data-view="categories" id="view-categories"></div>
      <div class="admin-view" data-view="bulk" id="view-bulk"></div>
      <div class="admin-view" data-view="website" id="view-website"></div>
      <div class="admin-view" data-view="workflow" id="view-workflow"></div>
      <div class="admin-view" data-view="permissions" id="view-permissions"></div>
    </main>
  </div>
</div>
</div>

<!-- ================================================================
     COMMAND PALETTE
     ================================================================ -->
<div id="adm-cmdk-overlay" role="dialog" aria-modal="true" aria-label="CMS search">
  <div id="adm-cmdk-panel">
    <div style="padding:16px 18px; border-bottom:1px solid var(--alt-border); display:flex; align-items:center; gap:10px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--alt-muted)" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="adm-cmdk-input" type="text" placeholder="Search products, media, collections, categories…" class="flex-1 outline-none text-[15px]" autocomplete="off">
      <span class="font-mono text-[10px] text-[var(--alt-muted)] border border-[var(--alt-border)] rounded px-1.5 py-0.5">ESC</span>
    </div>
    <div id="adm-cmdk-results" class="no-scrollbar" style="max-height:min(50vh,420px); overflow-y:auto; padding:8px 0;"></div>
  </div>
</div>

<!-- ================================================================
     GENERIC DRAWER
     ================================================================ -->
<div id="adm-drawer-overlay" class="adm-overlay"></div>
<div id="adm-drawer" class="adm-drawer" role="dialog" aria-modal="true">
  <div class="adm-drawer-head">
    <h2 id="adm-drawer-title" class="font-display text-lg font-medium">Details</h2>
    <button id="adm-drawer-close" class="adm-icon-btn" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div id="adm-drawer-body" class="adm-drawer-body"></div>
  <div id="adm-drawer-foot" class="adm-drawer-foot" style="display:none;"></div>
</div>

<!-- ================================================================
     CONFIRM DIALOG
     ================================================================ -->
<div id="adm-modal-wrap" class="adm-modal-wrap">
  <div class="adm-modal-backdrop"></div>
  <div class="adm-modal" role="alertdialog" aria-modal="true">
    <h3 id="adm-modal-title" class="font-display text-lg font-medium mb-2">Are you sure?</h3>
    <p id="adm-modal-body" class="text-sm text-[var(--alt-muted)] leading-relaxed mb-6"></p>
    <div class="flex gap-3">
      <button id="adm-modal-cancel" class="adm-btn adm-btn-ghost flex-1">Cancel</button>
      <button id="adm-modal-confirm" class="adm-btn adm-btn-primary flex-1">Confirm</button>
    </div>
  </div>
</div>

<script src="cms.js"></script>
</body>
</html>
